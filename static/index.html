<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时间线对照</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">时间线对照</div>

  <div class="date-nav">
    <button id="prevDay" title="前一天">←</button>
    <input type="date" id="datePicker">
    <button id="today" class="ghost">今天</button>
    <button id="nextDay" title="后一天">→</button>
  </div>

  <div class="zoom-ctl" title="Ctrl + 滚轮 也可缩放">
    <button id="zoomOut" title="缩小">−</button>
    <span id="zoomLabel">1×</span>
    <button id="zoomIn" title="放大">+</button>
    <button id="zoomReset" class="ghost" title="恢复默认">重置</button>
  </div>

  <div class="actions">
    <a id="statsLink" href="/static/stats.html" class="ghost">统计</a>
    <button id="exportCsv" class="ghost">CSV</button>
    <button id="exportXlsx" class="ghost">XLSX</button>
  </div>
</header>

<div class="legend">
  <span><i class="sw aligned"></i>对齐</span>
  <span><i class="sw offset"></i>偏移</span>
  <span><i class="sw unrecorded"></i>未记录</span>
  <span><i class="sw unplanned"></i>计划外</span>
  <span class="hint">拖动移动 · 拖边缘改时长 · 双击改名 · 悬停 × 删除 · 按 N 跳到此刻</span>
</div>

<main class="columns">
  <section class="col">
    <h2><span class="dot tpl"></span>理想 · <span id="tplName">工作日</span></h2>
    <div class="scroll-area">
      <div class="axis-wrap">
        <div class="hour-ruler" id="ruler"></div>
        <div class="axis" id="tplAxis"></div>
      </div>
    </div>
  </section>

  <section class="col">
    <h2><span class="dot act"></span>实际 · <span id="actualDate"></span></h2>
    <div class="scroll-area">
      <div class="axis-wrap">
        <div class="hour-ruler"></div>
        <div class="axis" id="actAxis"></div>
      </div>
    </div>
  </section>
</main>

<div class="quickbar">
  <input id="quickInput" type="text" autocomplete="off"
         placeholder="输入如 20:30-21:10 干活 ／ 20:30 干活 ／ 20:30- 干活（进行中）">
  <button id="quickSubmit">记录</button>
  <label class="opt"><input type="checkbox" id="chainPrev" checked> 从上一块接着算</label>
</div>
<div id="quickError" class="quick-error" hidden></div>

<div id="toast" class="toast" hidden>
  <span id="toastText"></span>
  <button id="toastUndo">撤销</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
