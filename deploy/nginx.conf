# timeline-trace 反向代理配置
#
# 场景：有公网 IP、没有域名。因此只能用自签证书，浏览器首次访问会告警，
# 需要手动点「继续访问」。这是无域名场景下的必然代价，不是配置问题。
#
# 用法：
#   1. conf.d 里同一文件可以同时放 http{} 和 server{}（nginx 会展开到主配置的 http 块）
#   2. limit_req_zone 必须在 http 上下文，所以放在 server 块外用一行 http 级别指令
#   3. 拷到 /etc/nginx/conf.d/timeline-trace.conf，nginx -t 后 reload

# --- http 上下文指令（nginx 允许在 conf.d 文件中这样写）---
limit_req_zone $binary_remote_addr zone=tt_login:10m rate=5r/m;

upstream timeline_trace {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    # 全站跳 HTTPS。自签证书下 HSTS 无意义（浏览器不认），故不启用。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/timeline-trace.crt;
    ssl_certificate_key /etc/nginx/ssl/timeline-trace.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 单人自用，不需要大请求体；收紧到 1M 顺便挡掉误传
    client_max_body_size 1m;

    # 登录失败会返回 401，限制频率给暴力猜口令加一道成本
    location = /api/login {
        limit_req zone=tt_login burst=3 nodelay;
        proxy_pass http://timeline_trace;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://timeline_trace;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
