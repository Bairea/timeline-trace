# 统计阈值。设计文档 §5.4「优先级四项的度量口径」。
#
# 此前这些数字硬编码在 app/stats.py 里。提出来是为了两件事：
# ① 调阈值不该改代码；② 阈值的出处要跟着数字走，免得半年后
#    没人知道「为什么是 7 小时」。
#
# 改这里**会立即改变所有历史日报的达标判定**——因为统计是查询时
# 现算的，不落库（design §3.1 第 4 条）。这是有意的。

sleep:
  # §5.4「睡眠」：当日睡眠块总时长与 7 小时下限比对。
  min_hours: 7.0
  # 入睡起始时刻的目标。当前仅作参考，尚未参与达标判定。
  target_start: "22:40"

exercise:
  # §5.4「早晚健身操」：5–20 分钟区间内即算达标。
  # 下限 5 而非 0，是为了排除「只做了 2 分钟就走了」的伪达标。
  min_minutes: 5
  max_minutes: 20

project:
  # §5.4「项目推进」：每工作日 45–90 分钟高质量推进即足够。
  min_minutes: 45
  max_minutes: 90
